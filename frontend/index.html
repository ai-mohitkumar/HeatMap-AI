<!doctype html>
<html lang="en" style="background-color: #090F1F;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HeatShield AI — AI-Powered Heat Safety &amp; Regional Intelligence</title>
    <meta name="description" content="Free public heat safety platform and biometeorological intelligence engine protecting communities from lethal extreme heat and wet-bulb traps." />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#090F1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="./leaflet.css" />
  </head>
  <body style="background-color: #090F1F; margin: 0; padding: 0; overflow-x: hidden; max-width: 100vw;">
    <div id="root" style="background-color: #090F1F; min-height: 100vh; overflow-x: hidden;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (window.location.protocol === 'file:') {
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            root.innerHTML =
              '<div style="max-width:520px;margin:48px auto;padding:24px;border-radius:16px;background:#0F172E;border:1px solid #334155;color:#F8FAFC;font-family:system-ui,sans-serif;line-height:1.5">' +
              '<h2 style="margin:0 0 8px;font-size:18px;color:#F59E0B">HeatShield AI Local Launcher Required</h2>' +
              '<p style="margin:0 0 12px;font-size:13px;color:#CBD5E1">Your browser blocks interactive modules and live maps when opened directly via <code>file://</code>.</p>' +
              '<p style="margin:0;font-size:13px;color:#93C5FD"><strong>Windows:</strong> Double-click <code>HeatShield-AI.bat</code>.<br/><strong>macOS / Linux:</strong> Run <code>./launch-mac-linux.sh</code> or <code>python3 -m http.server 8765 --directory web</code>.</p>' +
              '</div>';
          }
        }, 1200);
      }
    </script>
  </body>
</html>
